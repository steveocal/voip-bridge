#:schema node_modules/wrangler/config-schema.json
name = "voip-bridge"
account_id = "59045fe3aa5350d597a6f0671225e3ad"
main = "src/index.ts"
compatibility_date = "2025-08-08"
workers_dev = true
preview_urls = false

[[durable_objects.bindings]]
name = "CALL_STATE"
class_name = "CallState"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CallState"]

# Secrets (set with: wrangler secret put <name>)
# ODOO_URL, ODOO_DB, ODOO_USER, ODOO_PASS
# ASTERISK_URL, ASTERISK_USER, ASTERISK_PASS

[vars]
ODOO_URL = "https://www.infraredheaterpanels.co.uk"
ODOO_DB = "www.infraredheaterpanels.co.uk"
ASTERISK_URL = "http://64.176.181.195.nip.io:8088"

[[d1_databases]]
binding = "DB"
database_name = "voip-bridge-d1"
database_id = "c00b456b-d58b-4e45-8335-b790392a2869"

# Static assets (self-hosted sip.js so the softphone doesn't depend on a CDN).
[assets]
directory = "./public"


