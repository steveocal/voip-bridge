; Opening hours and phone menus set up in Odoo (Phone → Configuration →
; Phone Numbers: "Answer With", "Opening Hours"; Phone Menus). #included after
; extensions-phone-bridge-routing.conf; [pb-route] asks [pb-ivr] before it
; rings. pbx-sync.sh keeps these astdb keys in step with the worker
; (src/ivr.ts):
;
;   pbwhen/<our number>  = <ring|menu>|<menu id|->|<out-of-hours action>|<prompt|->
;   pbhours/<our number> = <time zone>|<open IFTIME specs, !-joined, or ->|<shut specs, or ->
;   pbmenu/<id>          = <prompt|->|<key timeout>|<retries>|<direct dial 0|1>
;   pbkey/<id>-<key>     = <action>      (key 0-9, s = *, h = #, t = no key)
;
; Actions: vm, hangup, repeat, fwd|<number>, menu|<id>, ring|<secs>|<Dial targets|->.
; Prompts are WAV files (spoken by Workers AI from Odoo's text) in
; /var/spool/asterisk/phone-bridge-prompts/<prompt>.wav; one that hasn't
; arrived yet is skipped rather than failing the call.

; ARG1 = our number, digits only. PBIVR=0: just ring as the route says (no
; menu, and open or no hours). PBIVR=1: the call was handled here.
[pb-ivr]
exten => s,1,Set(PBIVR=0)
same => n,Set(PBW=${DB(pbwhen/${ARG1})})
same => n,GotoIf($["${PBW}" = ""]?done)
same => n,Gosub(pb-hours,s,1(${ARG1}))
same => n,GotoIf($[${PBOPEN}]?open)
same => n,NoOp(IVR: ${ARG1} out of hours)
same => n,Set(PBIVR=1)
same => n,Set(PBNP=${CUT(PBW,|,5)})
same => n,GotoIf($["${PBNP}" = "-"]?closed)
same => n,GotoIf($[! ${STAT(e,/var/spool/asterisk/phone-bridge-prompts/${PBNP}.wav)}]?closed)
same => n,Answer()
same => n,Wait(0.5)
same => n,Playback(/var/spool/asterisk/phone-bridge-prompts/${PBNP})
same => n(closed),Gosub(pb-do,s,1(${CUT(PBW,|,3)}|${CUT(PBW,|,4)}))
same => n,Goto(done)
same => n(open),GotoIf($["${CUT(PBW,|,1)}" = "ring"]?done)
same => n,Set(PBIVR=1)
same => n,Gosub(pb-do,s,1(menu|${CUT(PBW,|,2)}))
same => n(done),Return()

; ARG1 = our number. PBOPEN=1 inside the opening hours (or with none), 0
; outside them or on a closure / public holiday.
[pb-hours]
exten => s,1,Set(PBOPEN=1)
same => n,Set(PBH=${DB(pbhours/${ARG1})})
same => n,GotoIf($["${PBH}" = ""]?done)
same => n,Set(PBTZ=${CUT(PBH,|,1)})
same => n,Set(PBSP=${CUT(PBH,|,3)})
same => n,Set(PBI=1)
same => n(shut),Set(PBS=${CUT(PBSP,!,${PBI})})
same => n,GotoIf($["${PBS}" = "" | "${PBS}" = "-"]?open)
same => n,GotoIf($[${IFTIME(${PBS},${PBTZ}?1:0)}]?closed)
same => n,Set(PBI=$[${PBI} + 1])
same => n,GotoIf($[${PBI} > 400]?open)
same => n,Goto(shut)
same => n(open),Set(PBSP=${CUT(PBH,|,2)})
same => n,GotoIf($["${PBSP}" = "-"]?done)
same => n,Set(PBI=1)
same => n(oloop),Set(PBS=${CUT(PBSP,!,${PBI})})
same => n,GotoIf($["${PBS}" = ""]?closed)
same => n,GotoIf($[${IFTIME(${PBS},${PBTZ}?1:0)}]?done)
same => n,Set(PBI=$[${PBI} + 1])
same => n,GotoIf($[${PBI} > 400]?closed)
same => n,Goto(oloop)
same => n(closed),Set(PBOPEN=0)
same => n(done),Return()

; Carry out one action. ARG1 = <kind>|<arg>|<arg> as in pbkey.
[pb-do]
exten => s,1,Set(PBK=${CUT(ARG1,|,1)})
same => n,NoOp(IVR action: ${ARG1})
same => n,GotoIf($["${PBK}" = "ring" | "${PBK}" = "fwd" | "${PBK}" = "menu" | "${PBK}" = "hangup"]?${PBK})
same => n(vm),Gosub(voicemail,s,1(${UNIQUEID}))
same => n,Return()
same => n(ring),GotoIf($["${CUT(ARG1,|,3)}" = "-" | "${CUT(ARG1,|,3)}" = ""]?vm)
same => n,Dial(${CUT(ARG1,|,3)},${CUT(ARG1,|,2)})
same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
same => n,Goto(vm)
same => n(fwd),Dial(Local/0x${CUT(ARG1,|,2)}@pb-ring-mobile/n,60)
same => n(done),Return()
same => n(hangup),Return()
same => n(menu),Gosub(pb-menu,s,1(${CUT(ARG1,|,2)}))
same => n,Return()

; ARG1 = menu id. Plays the prompt and waits for a key; repeats it on no key
; or a wrong one, then does the menu's "no key" action. PBHOPS stops menus
; that lead to each other from going round for ever.
[pb-menu]
exten => s,1,Set(PBM=${DB(pbmenu/${ARG1})})
same => n,GotoIf($["${PBM}" = ""]?vm)
same => n,Set(PBHOPS=$[0${PBHOPS} + 1])
same => n,GotoIf($[${PBHOPS} > 20]?vm)
same => n,Set(PBMID=${ARG1})
same => n,Set(PBTRY=0)
same => n,Answer()
same => n,Wait(0.5)
same => n,Set(TIMEOUT(digit)=3)
same => n,Goto(pb-menu-${IF($["${CUT(PBM,|,4)}" = "1"]?dd:keys)},s,1)
same => n(vm),Gosub(pb-do,s,1(vm))
same => n,Return()

; Entered by Goto from [pb-menu]: Return() goes back to [pb-menu]'s caller.
[pb-menu-keys]
exten => s,1,Set(PBP=${CUT(PBM,|,1)})
same => n,ExecIf($["${PBP}" != "-" & ${STAT(e,/var/spool/asterisk/phone-bridge-prompts/${PBP}.wav)}]?Background(/var/spool/asterisk/phone-bridge-prompts/${PBP}))
same => n,WaitExten(${CUT(PBM,|,2)})
exten => _[0-9],1,Set(PBKN=${EXTEN})
same => n(key),Set(PBA=${DB(pbkey/${PBMID}-${PBKN})})
same => n,GotoIf($["${PBA}" = ""]?i,1)
same => n,NoOp(IVR menu ${PBMID}: key ${PBKN})
same => n,GotoIf($["${PBA}" = "repeat"]?s,1)
same => n,Gosub(pb-do,s,1(${PBA}))
same => n,Return()
exten => *,1,Set(PBKN=s)
same => n,Goto(0,key)
exten => #,1,Set(PBKN=h)
same => n,Goto(0,key)
exten => i,1,Playback(pbx-invalid)
same => n,Goto(t,retry)
exten => t,1,NoOp(IVR menu ${PBMID}: no key)
same => n(retry),Set(PBTRY=$[${PBTRY} + 1])
same => n,GotoIf($[${PBTRY} > ${CUT(PBM,|,3)}]?none)
same => n,Goto(s,1)
same => n(none),Set(PBA=${DB(pbkey/${PBMID}-t)})
same => n,Gosub(pb-do,s,1(${IF($["${PBA}" = ""]?vm:${PBA})}))
same => n,Return()

; The same, and callers may also dial an extension (one that exists).
[pb-menu-dd]
include => pb-menu-keys
exten => _XX,1,Set(PBX=${EXTEN})
same => n,Goto(000,dd)
exten => _XX.,1,Set(PBX=${EXTEN})
same => n(dd),GotoIf($["${PJSIP_ENDPOINT(${PBX},context)}" = ""]?i,1)
same => n,NoOp(IVR menu ${PBMID}: dialled extension ${PBX})
same => n,Gosub(ext-dial,s,1(${PBX}))
same => n,Return()
