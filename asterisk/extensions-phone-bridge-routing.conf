; Inbound routing and forwarding set up in Odoo (Phone → Configuration →
; Phone Numbers; forwarding on each extension; each user's mobile), plus each
; user's 📼 / 📱 dashboard switches. #included at the end of extensions.conf
; by scripts/vps-setup-pbx-routing.sh. pbx-sync.sh keeps the astdb keys
; these read in step with the worker (GET /pbx/sync, src/pbxsync.ts):
;
;   pbroute/<our number, digits only> =
;     <ring seconds>|<record 0|1>|<no answer: vm, hangup or fwd<number>>|<Dial targets, or ->
;   pbfwd/<extension> =
;     <always|busy|noanswer|busynoanswer|vm>|<ring seconds>|<number, or ->
;   pbqueue/<our number> =
;     <max wait>|<options 0|1>|<message prompt>|<thanks prompt, or ->
;   pbblock/<last 9 digits of a caller's number> = 1, and
;   pbx/block_withheld = 1: blocked callers (dashboard, src/blocked.ts)
;   pbx/call_limits = <at once>|<per extension at once>|<per extension per hour>|<all per hour>:
;     outgoing call limits ([pb-out-limit], src/limits.ts)
;
; Events go to the worker through /etc/asterisk/pb-event.sh, which adds the
; PBX secret. System() runs its line through a shell, so a caller ID or
; dialled number only goes into one after FILTER().
;
; A number with no pbroute key keeps the hand-written routing in
; [voipms-inbound] / [default], which call [pb-route] first.

; ARG1 = the number the caller dialled. A blocked caller is rejected first,
; on every number, before anything rings or answers (cause 21, call
; rejected). Returns straight away (PBROUTED=0) when Odoo doesn't route the
; number. When it does, the call ends here: a hangup inside a Gosub doesn't
; run the caller's h extension, so [pb-route-hangup] sends the hangup event
; (with the talk time) instead. A number with a pbqueue key queues its
; callers ([pb-queue]) instead of ringing for Ring For seconds.
[pb-route]
exten => s,1,Set(PBROUTED=0)
same => n,Set(PBCN=${FILTER(0-9,${CALLERID(num)})})
same => n,GotoIf($[${LEN(${PBCN})} < 7]?withheld)
same => n,Set(PBCK=${PBCN})
same => n,ExecIf($[${LEN(${PBCN})} > 9]?Set(PBCK=${PBCN:-9}))
same => n,GotoIf(${DB_EXISTS(pbblock/${PBCK})}?blocked:route)
same => n(withheld),GotoIf($["${DB(pbx/block_withheld)}" = "1"]?blocked:route)
same => n(blocked),NoOp(BLOCKED: ${CALLERID(num)} -> ${ARG1})
same => n,Hangup(21)
same => n(route),Set(PBR=${DB(pbroute/${FILTER(0-9,${ARG1})})})
same => n,GotoIf($["${PBR}" = ""]?out)
same => n,Set(PBROUTED=1)
same => n,Set(CHANNEL(hangup_handler_push)=pb-route-hangup,s,1)
same => n,NoOp(ROUTE from Odoo: ${ARG1} = ${PBR})
same => n,Set(PBNA=${CUT(PBR,|,3)})
same => n,Set(PBDIAL=${CUT(PBR,|,4)})
same => n,ExecIf($["${CUT(PBR,|,2)}" = "1"]?Gosub(record-call,s,1(${UNIQUEID})))
same => n,Gosub(pb-ivr,s,1(${FILTER(0-9,${ARG1})}))
same => n,GotoIf($["${PBIVR}" = "1"]?out)
same => n,GotoIf($["${PBDIAL}" = "-"]?noanswer)
same => n,GotoIf(${DB_EXISTS(pbqueue/${FILTER(0-9,${ARG1})})}?queue)
same => n,Dial(${PBDIAL},${CUT(PBR,|,1)})
same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?out)
same => n(noanswer),GotoIf($["${PBNA:0:3}" = "fwd"]?fwd)
same => n,GotoIf($["${PBNA}" = "hangup"]?out)
same => n,Gosub(voicemail,s,1(${UNIQUEID}))
same => n,Goto(out)
same => n(fwd),NoOp(Not answered: forwarded to +${PBNA:3})
same => n,Dial(Local/0x${PBNA:3}@pb-ring-mobile/n,60)
same => n(out),GotoIf($["${PBROUTED}" = "1"]?end)
same => n,Return()
same => n(end),Hangup()
same => n(queue),Gosub(pb-queue,s,1(${FILTER(0-9,${ARG1})}))
same => n,GotoIf($["${PBQANS}" = "1"]?out:noanswer)

; The talk time: billsec, except that a queued call is answered (for the
; hold music) as it joins the queue, so there it is the time since joining
; less the time spent waiting (QEHOLDTIME), and 0 when nobody took the call.
[pb-route-hangup]
exten => s,1,Set(PBTALK=${CDR(billsec)})
same => n,GotoIf($["${PBQSTART}" = ""]?send)
same => n,Set(PBTALK=0)
same => n,GotoIf($["${MEMBERINTERFACE}" = ""]?send)
same => n,Set(PBQH=${QEHOLDTIME})
same => n,ExecIf($["${PBQH}" = ""]?Set(PBQH=0))
same => n,Set(PBTALK=$[${EPOCH} - ${PBQSTART} - ${PBQH}])
same => n,ExecIf($[${PBTALK} < 1]?Set(PBTALK=1))
same => n(send),System(/etc/asterisk/pb-event.sh "event=hangup" "callId=${FILTER(0-9.,${CDR(uniqueid)})}" "caller=${FILTER(A-Za-z0-9+._@-,${CALLERID(num)})}" "duration=${FILTER(0-9,${PBTALK})}" &)
same => n,Return()

; A call queue (Odoo: Phone Number → Queue Callers). ARG1 = our number,
; digits only. The caller hears hold music (class pbhold), their place in
; line and the number's queue message while queue pbq-<number>
; (queues-phone-bridge.conf, written by pbx-sync.sh) rings the members, for
; up to the max wait. PBQANS=1: someone took the call (it has ended by the
; time Queue returns); 0: the caller is still here and gets the number's
; "When Nobody Answers". With options on, pressing 1 or 2 leaves the queue
; for [pb-queue-exit]. Queue status in the log: TIMEOUT, JOINEMPTY (no
; phone signed in), LEAVEEMPTY.
[pb-queue]
exten => s,1,Set(PBQ=${DB(pbqueue/${ARG1})})
same => n,Set(PBQANS=0)
same => n,Set(PBQCALL=${UNIQUEID})
same => n,Set(PBQTHANKS=${CUT(PBQ,|,4)})
same => n,Answer()
same => n,Set(PBQSTART=${EPOCH})
same => n,Queue(pbq-${ARG1},,,,${CUT(PBQ,|,1)})
same => n,NoOp(QUEUE ${ARG1}: ${QUEUESTATUS})
same => n,ExecIf($["${MEMBERINTERFACE}" != ""]?Set(PBQANS=1))
same => n,Return()

; Keys a caller can press while queued (the queue's context): 1 leaves a
; voicemail; 2 asks for a callback, which flags the missed call in History
; (event=callback), says thank you and hangs up. A withheld number can't be
; called back, so its 2 leaves a message instead.
[pb-queue-exit]
exten => 1,1,NoOp(QUEUE: ${CALLERID(num)} chose to leave a message)
same => n,Gosub(voicemail,s,1(${PBQCALL}))
same => n,Hangup()
exten => 2,1,GotoIf($[${LEN(${FILTER(0-9,${CALLERID(num)})})} < 7]?1,1)
same => n,NoOp(QUEUE: ${CALLERID(num)} asked to be called back)
same => n,System(/etc/asterisk/pb-event.sh "event=callback" "callId=${FILTER(0-9.,${PBQCALL})}" &)
same => n,GotoIf($[! ${STAT(e,/var/spool/asterisk/phone-bridge-prompts/${PBQTHANKS}.wav)}]?bye)
same => n,Playback(/var/spool/asterisk/phone-bridge-prompts/${PBQTHANKS})
same => n(bye),Hangup()

; An extension that uses the Android app, as one leg of a ring list: wake
; the app if it isn't registered, then ring it ([ring-202] for any extension).
[pb-ring-app]
exten => _X.,1,Gosub(wake-phone,s,1(${EXTEN}))
same => n,GotoIf($["${PJSIP_DIAL_CONTACTS(${EXTEN})}" = ""]?done)
same => n,Dial(PJSIP/${EXTEN})
same => n(done),Hangup()

; A mobile or outside number as one leg: EXTEN = <delay>x<number, digits>.
; The delay gives the phones a head start: if one answers first, the parent
; Dial() hangs this leg up during the Wait and the mobile never rings. Shows
; our voip.ms number (voip.ms only passes our own numbers reliably) with the
; caller's number as the name, as [ring-mobile] does.
[pb-ring-mobile]
exten => _X.,1,Set(PBWAIT=${CUT(EXTEN,x,1)})
same => n,Set(PBNUM=${CUT(EXTEN,x,2)})
same => n,Set(FORWARDED_FROM=${CALLERID(num)})
same => n,ExecIf($[${PBWAIT} > 0]?Wait(${PBWAIT}))
same => n,Gosub(pb-out-limit,s,1())
same => n,ExecIf($["${PBLIMIT}" = "1"]?Hangup())
same => n,Set(CALLERID(num)=+447520658657)
same => n,Set(CALLERID(name)=Fwd ${FORWARDED_FROM})
same => n,Dial(PJSIP/+${PBNUM}@voipms)
same => n,Hangup()

; Calls to one of our extensions (internal dialling, [from-internal]). Odoo's
; forwarding and the user's 📼 switch come from astdb pbfwd/<extension>;
; "busy" also covers an extension that isn't signed in anywhere.
[ext-dial]
exten => s,1,NoOp(INTERNAL: ${CALLERID(num)} -> ${ARG1})
same => n,Set(PBF=${DB(pbfwd/${ARG1})})
same => n,Set(PBFM=${CUT(PBF,|,1)})
same => n,GotoIf($["${PBFM}" = "vm"]?vm)
same => n,GotoIf($["${PBFM}" = "always"]?fwd)
same => n,ExecIf($[${REGEX("(^|,)${ARG1}(,|$)" ${DB(pbx/push_extensions)},202)}]?Gosub(wake-phone,s,1(${ARG1})))
same => n,Set(PBFS=30)
same => n,ExecIf($["${PBFM}" = "noanswer" | "${PBFM}" = "busynoanswer"]?Set(PBFS=${CUT(PBF,|,2)}))
same => n,Dial(PJSIP/${ARG1},${PBFS})
same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
same => n,Set(PBBUSY=${IF($["${DIALSTATUS}" = "BUSY" | "${DIALSTATUS}" = "CHANUNAVAIL" | "${DIALSTATUS}" = "CONGESTION"]?1:0)})
same => n,GotoIf($[${PBBUSY} & ("${PBFM}" = "busy" | "${PBFM}" = "busynoanswer")]?fwd)
same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER" & ("${PBFM}" = "noanswer" | "${PBFM}" = "busynoanswer")]?fwd)
same => n,NoOp(${ARG1} not answered: ${DIALSTATUS})
same => n(vm),Set(VMKEY=${UNIQUEID})
same => n,ExecIf($["${CHANNEL(channeltype)}" = "PJSIP"]?Set(VMKEY=${CHANNEL(pjsip,call-id)}))
same => n,Gosub(voicemail,s,1(${VMKEY}))
same => n(done),Return()
same => n(fwd),NoOp(${ARG1} forwarded to +${CUT(PBF,|,3)})
same => n,Dial(Local/0x${CUT(PBF,|,3)}@pb-ring-mobile/n,60)
same => n,Return()

; Outgoing call limits (src/limits.ts, Settings → Limits on the dashboard).
; Gosub'd just before every Dial() out through the trunk: [outbound-dial],
; [ring-mobile], [mobile-call], [web-callback] (extensions.conf, patched by
; scripts/vps-call-limits.sh) and [pb-ring-mobile]. ARG1 = the extension
; placing the call, or empty when it is no one's (forwards, mobile legs, the
; website callback). Sets PBLIMIT=1 when a limit is reached; the caller then
; hangs up instead of dialling. astdb pbx/call_limits =
;   <at once>|<per extension at once>|<per extension per hour>|<all per hour>
; (pbx-sync.sh; 0 = no limit), else the defaults below, which match
; src/limits.ts DEFAULTS. "At once" counts channels in group all@pbout
; (and <ext>@pbext); "per hour" is a count per clock hour in astdb
; pbrate/all and pbrate/<ext> = <YYYYMMDDHH>|<calls started>. A channel is
; counted once however many times it dials (the Twilio fallback).
; A refused call is logged, posted to the worker (event=limit) and hears
; "all circuits are busy now".
[pb-out-limit]
exten => s,1,Set(PBLIMIT=0)
same => n,GotoIf($["${GROUP(pbout)}" = "all"]?done)
same => n,Set(PBL=${DB(pbx/call_limits)})
same => n,ExecIf($["${PBL}" = ""]?Set(PBL=10|3|40|150))
same => n,Set(PBLA=${FILTER(0-9,${CUT(PBL,|,1)})})
same => n,Set(PBLE=${FILTER(0-9,${CUT(PBL,|,2)})})
same => n,Set(PBLEH=${FILTER(0-9,${CUT(PBL,|,3)})})
same => n,Set(PBLH=${FILTER(0-9,${CUT(PBL,|,4)})})
same => n,ExecIf($["${PBLA}" = ""]?Set(PBLA=10))
same => n,ExecIf($["${PBLE}" = ""]?Set(PBLE=3))
same => n,ExecIf($["${PBLEH}" = ""]?Set(PBLEH=40))
same => n,ExecIf($["${PBLH}" = ""]?Set(PBLH=150))
same => n,Set(PBLX=${FILTER(0-9,${ARG1})})
same => n,Set(PBHOUR=${STRFTIME(${EPOCH},,%Y%m%d%H)})
same => n,Set(PBLREASON=at_once)
same => n,GotoIf($[${PBLA} > 0 & ${GROUP_COUNT(all@pbout)} >= ${PBLA}]?stop)
same => n,Set(PBRA=${DB(pbrate/all)})
same => n,Set(PBRAN=0)
same => n,ExecIf($["${CUT(PBRA,|,1)}" = "${PBHOUR}"]?Set(PBRAN=${FILTER(0-9,${CUT(PBRA,|,2)})}))
same => n,ExecIf($["${PBRAN}" = ""]?Set(PBRAN=0))
same => n,Set(PBLREASON=all_hour)
same => n,GotoIf($[${PBLH} > 0 & ${PBRAN} >= ${PBLH}]?stop)
same => n,GotoIf($["${PBLX}" = ""]?ok)
same => n,Set(PBLREASON=ext_at_once)
same => n,GotoIf($[${PBLE} > 0 & ${GROUP_COUNT(${PBLX}@pbext)} >= ${PBLE}]?stop)
same => n,Set(PBRE=${DB(pbrate/${PBLX})})
same => n,Set(PBREN=0)
same => n,ExecIf($["${CUT(PBRE,|,1)}" = "${PBHOUR}"]?Set(PBREN=${FILTER(0-9,${CUT(PBRE,|,2)})}))
same => n,ExecIf($["${PBREN}" = ""]?Set(PBREN=0))
same => n,Set(PBLREASON=ext_hour)
same => n,GotoIf($[${PBLEH} > 0 & ${PBREN} >= ${PBLEH}]?stop)
same => n,Set(GROUP(pbext)=${PBLX})
same => n,Set(DB(pbrate/${PBLX})=${PBHOUR}|$[${PBREN} + 1])
same => n(ok),Set(GROUP(pbout)=all)
same => n,Set(DB(pbrate/all)=${PBHOUR}|$[${PBRAN} + 1])
same => n(done),Return()
same => n(stop),Set(PBLIMIT=1)
same => n,Log(WARNING,CALL LIMIT ${PBLREASON} reached (limits ${PBL}) - refused ext ${PBLX} on ${CHANNEL})
same => n,System(/etc/asterisk/pb-event.sh "event=limit" "reason=${PBLREASON}" "ext=${PBLX}" &)
same => n,ExecIf($["${CHANNEL(state)}" != "Up"]?Progress())
same => n,Playback(all-circuits-busy-now,noanswer)
same => n,Return()
