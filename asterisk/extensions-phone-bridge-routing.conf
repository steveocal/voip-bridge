; Inbound routing and forwarding set up in Odoo (Phone → Configuration →
; Phone Numbers; forwarding on each extension; each user's mobile), plus each
; user's 📼 / 📱 dashboard switches. #included at the end of extensions.conf
; by scripts/vps-setup-pbx-routing.sh. pbx-sync.sh keeps the astdb keys
; these read in step with the worker (GET /pbx/sync, src/pbxsync.ts):
;
;   pbroute/<our number, digits only> =
;     <ring seconds>|<record 0|1>|<no answer: vm, hangup or fwd<number>>|<Dial targets, or ->
;   pbfwd/<extension> =
;     <always|busy|noanswer|busynoanswer|vm>|<ring seconds>|<number, or ->
;
; A number with no pbroute key keeps the hand-written routing in
; [voipms-inbound] / [default], which call [pb-route] first.

; ARG1 = the number the caller dialled. Returns straight away (PBROUTED=0)
; when Odoo doesn't route it. When it does, the call ends here: a hangup
; inside a Gosub doesn't run the caller's h extension, so [pb-route-hangup]
; sends the hangup event (with the talk time) instead.
[pb-route]
exten => s,1,Set(PBROUTED=0)
same => n,Set(PBR=${DB(pbroute/${FILTER(0-9,${ARG1})})})
same => n,GotoIf($["${PBR}" = ""]?out)
same => n,Set(PBROUTED=1)
same => n,Set(CHANNEL(hangup_handler_push)=pb-route-hangup,s,1)
same => n,NoOp(ROUTE from Odoo: ${ARG1} = ${PBR})
same => n,Set(PBNA=${CUT(PBR,|,3)})
same => n,Set(PBDIAL=${CUT(PBR,|,4)})
same => n,ExecIf($["${CUT(PBR,|,2)}" = "1"]?Gosub(record-call,s,1(${UNIQUEID})))
same => n,GotoIf($["${PBDIAL}" = "-"]?noanswer)
same => n,Dial(${PBDIAL},${CUT(PBR,|,1)})
same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?out)
same => n(noanswer),GotoIf($["${PBNA:0:3}" = "fwd"]?fwd)
same => n,GotoIf($["${PBNA}" = "hangup"]?out)
same => n,Gosub(voicemail,s,1(${UNIQUEID}))
same => n,Goto(out)
same => n(fwd),NoOp(Not answered: forwarded to +${PBNA:3})
same => n,Dial(Local/0x${PBNA:3}@pb-ring-mobile/n,60)
same => n(out),GotoIf($["${PBROUTED}" = "1"]?end)
same => n,Return()
same => n(end),Hangup()

[pb-route-hangup]
exten => s,1,System(curl -s -X POST "https://voip-bridge.wandering-mode-c597.workers.dev/call-event" --data-urlencode "event=hangup" --data-urlencode "callId=${CDR(uniqueid)}" --data-urlencode "caller=${CALLERID(num)}" --data-urlencode "duration=${CDR(billsec)}" &)
same => n,Return()

; An extension that uses the Android app, as one leg of a ring list: wake
; the app if it isn't registered, then ring it ([ring-202] for any extension).
[pb-ring-app]
exten => _X.,1,Gosub(wake-phone,s,1(${EXTEN}))
same => n,GotoIf($["${PJSIP_DIAL_CONTACTS(${EXTEN})}" = ""]?done)
same => n,Dial(PJSIP/${EXTEN})
same => n(done),Hangup()

; A mobile or outside number as one leg: EXTEN = <delay>x<number, digits>.
; The delay gives the phones a head start: if one answers first, the parent
; Dial() hangs this leg up during the Wait and the mobile never rings. Shows
; our voip.ms number (voip.ms only passes our own numbers reliably) with the
; caller's number as the name, as [ring-mobile] does.
[pb-ring-mobile]
exten => _X.,1,Set(PBWAIT=${CUT(EXTEN,x,1)})
same => n,Set(PBNUM=${CUT(EXTEN,x,2)})
same => n,Set(FORWARDED_FROM=${CALLERID(num)})
same => n,ExecIf($[${PBWAIT} > 0]?Wait(${PBWAIT}))
same => n,Set(CALLERID(num)=+447520658657)
same => n,Set(CALLERID(name)=Fwd ${FORWARDED_FROM})
same => n,Dial(PJSIP/+${PBNUM}@voipms)
same => n,Hangup()

; Calls to one of our extensions (internal dialling, [from-internal]). Odoo's
; forwarding and the user's 📼 switch come from astdb pbfwd/<extension>;
; "busy" also covers an extension that isn't signed in anywhere.
[ext-dial]
exten => s,1,NoOp(INTERNAL: ${CALLERID(num)} -> ${ARG1})
same => n,Set(PBF=${DB(pbfwd/${ARG1})})
same => n,Set(PBFM=${CUT(PBF,|,1)})
same => n,GotoIf($["${PBFM}" = "vm"]?vm)
same => n,GotoIf($["${PBFM}" = "always"]?fwd)
same => n,ExecIf($[${REGEX("(^|,)${ARG1}(,|$)" ${DB(pbx/push_extensions)},202)}]?Gosub(wake-phone,s,1(${ARG1})))
same => n,Set(PBFS=30)
same => n,ExecIf($["${PBFM}" = "noanswer" | "${PBFM}" = "busynoanswer"]?Set(PBFS=${CUT(PBF,|,2)}))
same => n,Dial(PJSIP/${ARG1},${PBFS})
same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
same => n,Set(PBBUSY=${IF($["${DIALSTATUS}" = "BUSY" | "${DIALSTATUS}" = "CHANUNAVAIL" | "${DIALSTATUS}" = "CONGESTION"]?1:0)})
same => n,GotoIf($[${PBBUSY} & ("${PBFM}" = "busy" | "${PBFM}" = "busynoanswer")]?fwd)
same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER" & ("${PBFM}" = "noanswer" | "${PBFM}" = "busynoanswer")]?fwd)
same => n,NoOp(${ARG1} not answered: ${DIALSTATUS})
same => n(vm),Set(VMKEY=${UNIQUEID})
same => n,ExecIf($["${CHANNEL(channeltype)}" = "PJSIP"]?Set(VMKEY=${CHANNEL(pjsip,call-id)}))
same => n,Gosub(voicemail,s,1(${VMKEY}))
same => n(done),Return()
same => n(fwd),NoOp(${ARG1} forwarded to +${CUT(PBF,|,3)})
same => n,Dial(Local/0x${CUT(PBF,|,3)}@pb-ring-mobile/n,60)
same => n,Return()
