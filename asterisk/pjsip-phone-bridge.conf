; Phone Bridge extension templates. Add to the end of pjsip.conf:
;
;   #include pjsip-phone-bridge.conf
;   #include pjsip-phone-bridge-extensions.conf
;
; pbx-sync.sh writes pjsip-phone-bridge-extensions.conf from the extensions
; in Odoo (Phone → Configuration → Extensions), one endpoint, auth and aor per
; extension built on these templates. Never edit that file: the next sync
; overwrites it. An extension still defined by hand elsewhere in pjsip.conf is
; skipped, so hand-made ones can be moved to Odoo one at a time.
; Live voip-bridge copy: context = from-internal. Change these to suit (codecs);
; they're only read here.

; Browser or app: the dashboard, the Odoo softphone, the Android app.
[pb-webrtc](!)
type = endpoint
context = from-internal
disallow = all
allow = opus,ulaw,alaw,vp8
direct_media = no
force_rport = yes
rewrite_contact = yes
rtp_symmetric = yes
webrtc = yes
ice_support = yes
use_avpf = yes
rtcp_mux = yes
media_encryption = dtls
dtls_auto_generate_cert = yes
dtls_verify = fingerprint
dtls_setup = actpass

; Desk phone or SIP softphone (Linphone and the like), over UDP.
[pb-sip](!)
type = endpoint
context = from-internal
disallow = all
allow = ulaw,alaw,g722,opus,h264,vp8
direct_media = no
force_rport = yes
rewrite_contact = yes
rtp_symmetric = yes
; As ext 200 (desk phone) had by hand: the phone's alert-info for incoming calls.
set_var = ALERT_INFO = Ring Answer

[pb-auth](!)
type = auth
auth_type = userpass

; One device per extension; a new registration replaces the old one.
[pb-aor](!)
type = aor
max_contacts = 1
remove_existing = yes
